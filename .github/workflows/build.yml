name: Build APK
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: flet build apk --yes --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoubaFoot-APK
          path: build/apk
